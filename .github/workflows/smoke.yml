# Smoke tests only run on non-master branches. Smoke tests cut
# some corners by running selected tests in parallel (to shave off
# some execution time)
# Once a pull request is merged to master, workflows/ci.yml is run
name: Smoke Tests
on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Smoke"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check documentation generator
        run: |
          find . -name '*.md' -not -name 'AGENTS.md' -not -name 'CLAUDE.md' -not -path './examples/*' | xargs env AUTODOC_DRYRUN=1 perl tools/autodoc.pl
      - name: Cache testdata
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        env:
          TEST_SUITE_COMMIT: "48461fc3568972801b40eaccc428a31bce338f6e"
        with:
          path: tests
          key: ${{ runner.os }}-testdata-${{ env.TEST_SUITE_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-testdata-
      - name: Setup testdata
        env:
          TEST_SUITE_COMMIT: "48461fc3568972801b40eaccc428a31bce338f6e"
        run: |
          ./init-test-suite.sh $TEST_SUITE_COMMIT
      - name: Cache Go modules
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/bazel
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install Go stable version
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true
      - name: Run smoke tests
        run: go test -short ./...

